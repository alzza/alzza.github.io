<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <title>제목 · alzza</title>
  <meta name="description" content="한 줄 요약" />
  <meta name="theme-color" content="#FFD23F" />
  <link rel="stylesheet" href="../assets/style.css?v=6" />
</head>
<body>
  <header class="bar">
    <div class="wrap site-head">
      <a class="brand" href="../"><span class="avatar">A</span>alzza<i>.</i></a>
      <nav class="nav">
        <a class="btn" href="./">노트</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="다크 테마로 전환" aria-pressed="false"></button>
    </div>
  </header>

  <div class="wrap prose">
    <section class="hero">
      <span class="badge">노트</span>
      <h1>제목</h1>
      <p class="note-meta">YYYY-MM-DD</p>
    </section>

    <p>본문.</p>

    <h2>코드</h2>
    <span class="code-label">txt</span>
    <div class="code-block-wrap">
      <button class="code-copy" type="button" data-copy>copy</button>
      <pre class="code-block"><code>print("ok")</code></pre>
    </div>
  </div>
  <script src="../assets/theme.js?v=4"></script>
</body>
</html>
