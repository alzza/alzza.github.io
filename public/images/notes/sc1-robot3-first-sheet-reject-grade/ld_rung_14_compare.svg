<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Robot3 Reject Rung 14 등급 비교 래더</title>
  <desc id="desc">카운터가 0일 때 원본은 등급 2와 3, 수정본은 등급 3과 4를 검사하는 Rung 14 비교</desc>
  <style>
    .rail,.wire,.device{fill:none;stroke:#243b7a;stroke-width:2;vector-effect:non-scaling-stroke}
    .rail{stroke-width:3}.junction{fill:#243b7a}.label{font:16px Arial,'Segoe UI',sans-serif;fill:#111;text-anchor:middle}
    .op{font:700 12px Arial,'Segoe UI',sans-serif;fill:#243b7a;text-anchor:middle}.small{font:13px Arial,'Segoe UI',sans-serif;fill:#243b7a;text-anchor:middle}
    .title{font:700 22px Arial,'Segoe UI',sans-serif;fill:#183a5a}.subtitle{font:15px Arial,'Segoe UI',sans-serif;fill:#5d6673}
    .block{fill:#fff;stroke:#243b7a;stroke-width:1.5}.grade{fill:#f7f8fb;stroke:#243b7a;stroke-width:1.5}.changed{fill:#e8f6ec;stroke:#168447;stroke-width:2}
    .divider{stroke:#b9c1cf;stroke-width:1}.tag{font:15px 'SFMono-Regular',Consolas,monospace;fill:#111;text-anchor:middle}.note{font:14px Arial,'Segoe UI',sans-serif;fill:#334155}
  </style>
  <rect width="1800" height="900" fill="#fff"/>
